<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A fictional fake hacker terminal simulator for entertainment.">
<title>Fake Hacker Terminal Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23000'/%3E%3Cpath d='M14 18l16 14-16 14' fill='none' stroke='%2300ff66' stroke-width='6'/%3E%3Cpath d='M34 46h18' stroke='%2300ff66' stroke-width='6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="window" id="window">
  <header class="topbar">
    <div class="status"><span class="dot"></span><span>TERMINAL ONLINE</span></div>
    <div class="controls">
      <button type="button" id="btnSound">SOUND: OFF</button>
      <button type="button" id="btnTheme">THEME: GREEN</button>
      <button type="button" id="btnFull">FULLSCREEN</button>
    </div>
  </header>

  <section class="screen" id="screen" aria-label="Terminal">
    <div id="output" aria-live="polite"></div>
    <div class="prompt" id="prompt">
      <label for="cmd" class="ps1">operator@simulator:~$</label>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Command input">
    </div>
  </section>

  <nav class="pad" aria-label="Touch controls">
    <button type="button" data-key="up">&#8593;</button>
    <button type="button" data-key="down">&#8595;</button>
    <button type="button" data-key="enter" class="wide">ENTER</button>
    <button type="button" data-key="esc">ESC</button>
  </nav>

  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="matrix-hint" id="matrixHint">ESC / TAP TO EXIT</div>
</main>
<script src="script.js"></script>
</body>
</html>
